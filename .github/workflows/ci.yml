name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least privilege by default. No production secrets.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  CI: true

jobs:
  linux-validate:
    name: Linux validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - name: Restore (locked-mode)
        run: dotnet restore MikroTikFirewallController.sln --locked-mode

      - name: Format verification
        run: dotnet format MikroTikFirewallController.sln --verify-no-changes --no-restore

      - name: Build Release
        run: dotnet build MikroTikFirewallController.sln -c Release --no-restore

      - name: Unit and architecture tests with coverage
        run: >
          dotnet test tests/Mfc.UnitTests/Mfc.UnitTests.csproj
          -c Release --no-build
          --collect:"XPlat Code Coverage"
          --results-directory "${{ runner.temp }}/coverage"
          -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura

      - name: Verify Domain/Application coverage thresholds
        run: python3 scripts/ci/verify-coverage-thresholds.py "${{ runner.temp }}/coverage"

      - name: PostgreSQL integration tests
        run: dotnet test tests/Mfc.IntegrationTests/Mfc.IntegrationTests.csproj -c Release --no-build

      - name: RouterOS project smoke tests
        run: dotnet test tests/Mfc.RouterOs.IntegrationTests/Mfc.RouterOs.IntegrationTests.csproj -c Release --no-build

      - name: Package vulnerability scan
        run: |
          set -euo pipefail
          out="${{ runner.temp }}/vulnerable-packages.txt"
          dotnet list MikroTikFirewallController.sln package --vulnerable --include-transitive | tee "$out"
          if grep -Eq 'Severity[[:space:]]*:' "$out"; then
            echo "::error::Vulnerable NuGet packages detected"
            exit 1
          fi

      - name: Verify working tree unchanged
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Build/test mutated the working tree"
            git status --porcelain
            exit 1
          fi

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-linux
          path: ${{ runner.temp }}/coverage
          retention-days: 7
          if-no-files-found: warn

  windows-desktop:
    name: Windows Desktop build
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - name: Restore (locked-mode)
        run: dotnet restore MikroTikFirewallController.sln --locked-mode

      - name: Build Desktop Release
        run: dotnet build src/Mfc.Desktop/Mfc.Desktop.csproj -c Release --no-restore

      - name: Upload Desktop build output
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-windows-release
          path: src/Mfc.Desktop/bin/Release/net10.0/
          retention-days: 3
          if-no-files-found: error
